name: CI

# Runs on every push and pull request. Deliberately needs NO secrets: the
# tests are pure logic and the build tolerates a missing configuration, so a
# contributor's fork gets the same green tick the main repo does. A CI that
# only passes for the maintainer is not much of a CI.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      # Failures are echoed as workflow `::error::` commands as well as to
      # the log. GitHub turns those into check-run annotations, which are
      # readable through the API — the raw logs are served from a blob host
      # that some environments cannot reach, and "Process completed with
      # exit code 1" is not a diagnosis.
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log || true
          if grep -q "^# fail [^0]" /tmp/test.log; then
            grep -E "^not ok " /tmp/test.log | while read -r line; do
              echo "::error title=Test failure::${line}"
            done
            sed -n "/^  error:/,/^  code:/p" /tmp/test.log | head -40 | while read -r line; do
              echo "::error title=Assertion::${line}"
            done
            exit 1
          fi
          grep -E "^# (tests|pass|fail)" /tmp/test.log
      - name: Build
        run: npx next build
